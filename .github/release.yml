changelog:
  exclude:
    labels:
      - documentation
      - internal
      - skip-changelog
  categories:
    - title: "🚀 新功能"
      labels:
        - feature
        - enhancement
    - title: "🐛 问题修复"
      labels:
        - bug
        - fix
    - title: "📦 依赖更新"
      labels:
        - dependencies
    - title: "🛠️ 其他变更"
      labels:
        - "*"
